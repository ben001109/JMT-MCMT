name: Split loader branches (1.21.1)

# Lives on master because GitHub only triggers workflow_run from the default branch.
# After a successful build of the development branch, regenerate the read-only
# single-loader branches 1.21.1-fabric and 1.21.1-neoforge.
on:
  workflow_run:
    workflows: ["Build and smoke test (1.21.1)"]
    types: [completed]
    branches: ['1.21.1']

permissions:
  contents: write

jobs:
  split:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Generate and push loader branches
        run: |
          git checkout -q -B 1.21.1
          bash tools/split-loader-branch.sh fabric --push
          bash tools/split-loader-branch.sh neoforge --push
