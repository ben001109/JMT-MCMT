name: Build and smoke test (1.21.1)

on:
  push:
    branches: ['1.21.1']
  pull_request:
    branches: ['1.21.1']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/smoke/bot/package-lock.json
      - name: Unit tests
        run: ./gradlew :common:test --no-daemon
      - name: Build jars
        run: ./gradlew buildAll --no-daemon
      - name: Smoke test Fabric
        run: bash tests/smoke/run-smoke.sh fabric 60
      - name: Smoke test NeoForge
        if: always()
        run: bash tests/smoke/run-smoke.sh neoforge 60
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmt_mcmt-1.21.1-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reports
          path: tests/smoke/out/
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: common/build/reports/tests/
